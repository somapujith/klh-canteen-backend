# Ephemeral Postgres for the automated test suite ONLY.
#
# Deliberately separate from docker-compose.yml (the dev database) so that
# `npm run test:db:reset` can drop and recreate everything without anyone
# losing dev data — and so the ports never collide.
#
# Two services, because the app talks to Postgres through
# @neondatabase/serverless (see src/lib/prisma.ts -> PrismaNeon), which speaks
# the Postgres wire protocol over a *WebSocket*, not raw TCP. `wsproxy`
# terminates that WebSocket and forwards to plain Postgres, which is how you
# run Neon-driver code against a local database.
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: klh-canteen-test-pg
    environment:
      POSTGRES_USER: klh_test
      POSTGRES_PASSWORD: klh_test
      POSTGRES_DB: klh_canteen_test
    ports:
      - "55433:5432"
    # No named volume on purpose: this database is disposable. `docker compose
    # -f docker-compose.test.yml down` must leave nothing behind.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klh_test -d klh_canteen_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  wsproxy-test:
    image: ghcr.io/neondatabase/wsproxy:latest
    container_name: klh-canteen-test-wsproxy
    environment:
      APPEND_PORT: "postgres-test:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "55480:80"
    depends_on:
      postgres-test:
        condition: service_healthy
