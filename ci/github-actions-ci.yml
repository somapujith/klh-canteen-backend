name: CI

# Runs typecheck and the full test suite against a dedicated Neon branch
# (project `KLH Canteen`, branch `test`, database `klh_canteen_test`) — never
# against the production branch.
#
# The database URL lives in the TEST_DATABASE_URL repository secret. That
# alone is not trusted: tests/setup/databaseGuard.ts independently refuses to
# run against anything whose database name doesn't contain "test", whose
# identity matches what .env/.env.production point at, or that lacks the
# physical marker table this suite itself creates — so even a misconfigured
# secret cannot point the tests at production. See TESTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Deliberately named TEST_DATABASE_URL, not DATABASE_URL: the suite never
      # reads a database URL out of the ambient environment, precisely so that
      # a stray DATABASE_URL cannot steer it.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # Required opt-in for any non-local DATABASE_URL — see databaseGuard.ts.
      ALLOW_REMOTE_TEST_DATABASE: "1"
      JWT_SECRET: ci-jwt-secret-not-a-real-secret
      QR_TOKEN_SECRET: ci-qr-secret-not-a-real-secret
      CORS_ORIGIN: "*"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck (src)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:tests

      # No lint script is configured in this repo yet. When one is added (biome
      # per the project conventions), add it here as its own step.
      - name: Lint
        run: |
          if npm run | grep -qE '^  lint$'; then
            npm run lint
          else
            echo "No lint script configured — skipping. Add one and wire it up here."
          fi

      # globalSetup applies migrations to the Neon test branch and refuses to
      # run at all if TEST_DATABASE_URL is not a disposable test database.
      - name: Test
        run: npm test
